services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chick
      POSTGRES_PASSWORD: chick
      POSTGRES_DB: chick
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
volumes:
  pgdata: {}
