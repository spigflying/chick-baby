<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仙境手繪農場・蘋果樹預覽</title>
<script type="module">
  import '../../src/style.css';
  import { ALWAYS_OPEN, describeFarm, newFarm } from '@chick/engine';
  import { FarmView } from '../../src/farm-view.ts';

  const now = Date.now();
  const state = newFarm(42, now, ALWAYS_OPEN);
  state.level = 4;
  const stage = new URLSearchParams(location.search).get('stage');
  const ready = stage === 'growing' ? now + 30 * 60_000 : stage === 'withered' ? now - 9 * 60 * 60_000 : now - 60_000;
  state.tree = { start: ready - 120 * 60_000, ready };
  const view = new FarmView({ touch: false }, { id: 'demo', display_name: 'Demo' }, () => {}, () => {}, () => 1200);
  view.theme = 'storybook';
  view.data = { owner: { id: 'demo', display_name: 'Demo' }, is_owner: true, state, derived: describeFarm(state, now, ALWAYS_OPEN), server_time: now };
  view.ownerId = 'demo';
  view.loadedAt = now;
  view.panel = { k: 'tree' };
  view.root.hidden = false;
  view.root.classList.add('on');
  view.render();
</script>
</html>
