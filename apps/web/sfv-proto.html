<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>小雞寶寶 · 1v1 格鬥原型</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root { --bg: #0e0f13; --panel: #171922; --line: #2a2e3b; --text: #e8eaf0; --dim: #8a90a2; --ok: #3ddc84; --bad: #ff5c5c; --warn: #ffc94d; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#mon { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; padding: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
.card b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card span { color: var(--dim); font-size: 11px; white-space: nowrap; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
main { display: grid; grid-template-columns: 170px minmax(0, 960px) 170px; gap: 8px; justify-content: center; padding: 0 8px; }
canvas { width: 100%; height: auto; background: #000; border: 1px solid var(--line); border-radius: 6px; image-rendering: pixelated; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; overflow: hidden; max-height: 560px; }
aside h3 { margin: 0 0 4px; font-size: 12px; color: var(--dim); font-weight: 600; }
aside ol { list-style: none; margin: 0; padding: 0; }
aside li { display: flex; justify-content: space-between; gap: 6px; padding: 1px 0; border-bottom: 1px solid #20232e; }
aside li i { color: var(--dim); font-style: normal; }
#ctl { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px; justify-content: center; }
#ctl label { display: flex; gap: 6px; align-items: center; }
#ctl button, #ctl select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; font: inherit; cursor: pointer; }
#ctl button:hover { border-color: var(--warn); }
#keys { text-align: center; color: var(--dim); padding: 0 16px 6px; }
#log { text-align: center; color: var(--warn); min-height: 18px; padding-bottom: 12px; }
kbd { background: #252836; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--text); }
</style>
</head>
<body>
<div id="mon"></div>
<main>
  <aside><h3>P1 輸入紀錄（伺服器確認）</h3><ol id="histL"></ol></aside>
  <canvas id="cv" width="960" height="540"></canvas>
  <aside><h3>P2 輸入紀錄（伺服器確認）</h3><ol id="histR"></ol></aside>
</main>
<div id="ctl">
  <label>RTT <input id="rtt" type="range" min="0" max="400" step="10" value="100"> <output id="rttOut">100ms</output></label>
  <label>抖動 <input id="jit" type="range" min="0" max="80" step="5" value="10"> <output id="jitOut">10ms</output></label>
  <label>對手 <select id="opp"><option value="ai">AI</option><option value="dummy">木樁</option><option value="crouch">木樁（蹲防）</option><option value="stand">木樁（站防）</option></select></label>
  <label><input id="boxes" type="checkbox" checked> 顯示判定框</label>
  <button id="close">模擬 20:00 關門</button>
  <button id="resettle">重送結算</button>
  <button id="toSelect">回選角</button>
</div>
<div id="keys">
  <kbd>W</kbd>跳 <kbd>S</kbd>蹲 <kbd>A</kbd><kbd>D</kbd>左右（按住後＝防禦）｜
  <kbd>U</kbd>輕拳 <kbd>I</kbd>重拳 <kbd>J</kbd>輕腳 <kbd>K</kbd>重腳｜
  <kbd>U</kbd>+<kbd>J</kbd>/<kbd>H</kbd> 摔 <kbd>I</kbd>+<kbd>K</kbd>/<kbd>L</kbd> 炸毛｜
  236P 蛋波・623P/626P 衝天啄・214K 旋風翅・236236K 火雞連環踢（3 格）・必殺技＋雙拳/雙腳＝EX
</div>
<div id="log"></div>
<script>
// === [MODULE 1: packages/engine/sfv.ts] ===
// 純決定性格鬥引擎：零 DOM、不用 Math.random、不讀時間，全部整數運算 → 伺服器（Node）與瀏覽器跑出來一模一樣。
// 座標：x = 角色中心（px），y = 腳底高度（0 = 地面，往上為負），vy 往上為負。
const SFV = (() => {
  'use strict';
  const TICK_HZ = 60, TICK_MS = 1000 / TICK_HZ;
  const UP = 1, DOWN = 2, LEFT = 4, RIGHT = 8, LP = 16, HP = 32, LK = 64, HK = 128;
  const PUNCH = LP | HP, KICK = LK | HK, BUTTONS = 0xf0;
  const STAGE_W = 960, WALL = 24;
  const HP_MAX = 1000, STUN_MAX = 1000, EX_BAR = 100, EX_MAX = 300, VG_MAX = 300;
  // 狀態裡的輸入環形緩衝：搓招最長看 24 tick（236236K），32 夠用，也讓快照維持在 600 bytes 以下
  const HIST = 32, CMD_WINDOW = 15, CA_WINDOW = 24, MULTI_PRESS = 3;
  const HS_LIGHT = 8, HS_HEAVY = 13;
  const GRAVITY = 1, JUMP_VY = -15, WALK_F = 4, WALK_B = 3, JUMP_VX = 4, PREJUMP_T = 3, JUMP_LAND = 3;
  const KD_SOFT = 40, KD_HARD = 60, DIZZY_T = 120, TECH_WINDOW = 7, TECH_T = 16, THROW_RECOVERY = 14;
  const WHITE_DELAY = 90, WHITE_REGEN = 3, STUN_DELAY = 120, STUN_DECAY = 3;
  const SUPER_FREEZE = 30, VT_TICKS = 480;
  const ROUND_TICKS = 99 * TICK_HZ, INTRO_T = 90, KO_T = 150, WINS = 2, JUGGLE_MAX = 3, PROJ_CD = 6;
  const AIR_RESET = [3, -6];
  const ST = Object.freeze({ IDLE: 0, CROUCH: 1, PREJUMP: 2, JUMP: 3, MOVE: 4, HIT: 5, BLOCK: 6, AIRHIT: 7, KD: 8, THROWN: 9, THROWING: 10, DIZZY: 11, LAND: 12, KO: 13, TECH: 14 });
  const ST_NAME = Object.keys(ST);
  const RS = Object.freeze({ FIGHT: 0, KO: 1, OVER: 2, INTRO: 3 });

  // 盒子都是 [x, y, w, h]，x 以「面向前方」為正，相對角色中心與腳底
  const HURT = { stand: [[-18, -92, 36, 42], [-22, -50, 44, 50]], crouch: [[-20, -62, 40, 28], [-24, -34, 48, 34]], air: [[-18, -86, 36, 44], [-16, -42, 32, 30]] };
  const PUSH = { stand: [-16, -82, 32, 82], crouch: [-18, -56, 36, 56], air: [-14, -80, 28, 60], down: [-30, -18, 60, 18] };

  // ---------- defineMove：用區間算每一 tick 的判定與速度，不寫逐幀表 ----------
  function keyframes(list, dflt) {
    return (mt) => { for (const [a, b, vx, vy] of list) if (mt >= a && mt <= b) return [vx, vy]; return dflt; };
  }
  function defineMove(c) {
    const S = c.startup, A = c.active ?? 0, R = c.recovery ?? 0;
    const hits = c.hits ?? (c.hitbox || c.throwBox ? 1 : 0);
    const dmg = Array.isArray(c.dmg) ? c.dmg : new Array(Math.max(hits, 1)).fill(c.dmg ?? 0);
    const inv = c.invuln ?? [], hover = c.hover ?? null;
    const vel = typeof c.vel === 'function' ? c.vel : keyframes(c.vel ?? [], c.air || c.untilLand ? [null, null] : [0, null]);
    return Object.freeze({
      kind: 'normal', guard: 'high', cancel: [], posture: c.air ? 'air' : 'stand', hs: HS_HEAVY, pb: 8, stun: 0, hitstun: 0, blockstun: 0,
      ...c, S, A, R, hits, dmg, vel,
      total: c.untilLand ? Infinity : S + A + R,
      /** 第幾段攻擊判定（-1 = 沒有）：active 區間平均切成 hits 段 */
      hitIndex(mt) { if (!hits || mt < S || mt >= S + A) return -1; return Math.min(hits - 1, ((mt - S) * hits / A) | 0); },
      phase(mt) { return mt < S ? 0 : mt < S + A ? 1 : 2; },
      invulnAt(mt, kind) { for (const [a, b, k] of inv) if (mt >= a && mt <= b && (k === kind || k === 'full')) return true; return false; },
      hoverAt(mt) { return !!hover && mt >= hover[0] && mt <= hover[1]; },
    });
  }

  const LIGHT = { hs: HS_LIGHT, pb: 6, light: true }, HEAVY = { hs: HS_HEAVY, pb: 9 };
  const variants = (list, make) => list.map(make);
  const MOVE_LIST = [
    defineMove({ id: '5LP', name: '站輕拳', ...LIGHT, startup: 4, active: 2, recovery: 7, dmg: 30, stun: 70, hitstun: 13, blockstun: 11, hitbox: [18, -80, 44, 14], hurtExt: [18, -84, 40, 20], cancel: ['chain', 'special'] }),
    defineMove({ id: '5HP', name: '站重拳', ...HEAVY, startup: 9, active: 3, recovery: 18, dmg: 90, stun: 150, hitstun: 22, blockstun: 17, hitbox: [18, -84, 60, 18], hurtExt: [18, -88, 52, 24], cancel: ['special'] }),
    defineMove({ id: '5LK', name: '站輕腳', ...LIGHT, startup: 5, active: 2, recovery: 10, dmg: 30, stun: 70, hitstun: 14, blockstun: 12, hitbox: [16, -46, 52, 14], hurtExt: [16, -50, 46, 18], cancel: ['chain', 'special'] }),
    defineMove({ id: '5HK', name: '站重腳', ...HEAVY, pb: 12, startup: 10, active: 3, recovery: 20, dmg: 100, stun: 150, hitstun: 22, blockstun: 16, hitbox: [16, -96, 66, 20], hurtExt: [16, -100, 58, 26] }),
    defineMove({ id: '2LP', name: '蹲輕拳', ...LIGHT, posture: 'crouch', startup: 4, active: 2, recovery: 8, dmg: 30, stun: 70, hitstun: 13, blockstun: 11, hitbox: [16, -52, 42, 12], hurtExt: [16, -56, 36, 18], cancel: ['chain', 'special'] }),
    defineMove({ id: '2HP', name: '蹲重拳（對空）', ...HEAVY, posture: 'crouch', startup: 6, active: 4, recovery: 20, dmg: 80, stun: 150, hitstun: 20, blockstun: 16, hitbox: [6, -124, 36, 70], hurtExt: [4, -116, 30, 54], cancel: ['special'] }),
    defineMove({ id: '2LK', name: '蹲輕腳', ...LIGHT, posture: 'crouch', guard: 'low', startup: 5, active: 2, recovery: 9, dmg: 20, stun: 50, hitstun: 12, blockstun: 10, hitbox: [16, -16, 48, 14], hurtExt: [16, -20, 42, 20], cancel: ['chain', 'special'] }),
    defineMove({ id: '2HK', name: '掃堂腿', ...HEAVY, posture: 'crouch', guard: 'low', kd: true, startup: 8, active: 3, recovery: 26, dmg: 90, stun: 150, blockstun: 16, hitbox: [14, -14, 74, 14], hurtExt: [14, -18, 66, 18] }),
    defineMove({ id: '8HP', name: '跳重拳', ...HEAVY, air: true, guard: 'overhead', startup: 7, active: 5, recovery: 8, dmg: 80, stun: 150, hitstun: 18, blockstun: 15, hitbox: [10, -62, 44, 26], hurtExt: [10, -66, 36, 30] }),
    defineMove({ id: '8HK', name: '跳重腳', ...HEAVY, air: true, guard: 'overhead', startup: 8, active: 6, recovery: 8, dmg: 90, stun: 150, hitstun: 18, blockstun: 15, hitbox: [6, -38, 60, 20], hurtExt: [6, -42, 52, 24] }),
    defineMove({ id: 'THROW', name: '摔技', kind: 'throw', startup: 5, active: 2, recovery: 20, dmg: 120, stun: 150, throwBox: [12, -84, 40, 64], hurtExt: [12, -80, 30, 40] }),
    defineMove({ id: 'VT', name: '炸毛衝刺', kind: 'system', startup: 1, recovery: 17, vel: [[1, 14, 9, null]] }),
    ...variants([['L', 0, '輕'], ['H', 1, '重'], ['EX', 2, 'EX']], ([v, lv, n]) => defineMove({
      id: 'HADO_' + v, name: `蛋波（${n}）`, kind: 'special', ex: lv === 2, projectile: lv, startup: 12, recovery: 33, hurtExt: [14, -84, 30, 22], cancel: ['super'],
    })),
    defineMove({ id: 'DP_L', name: '衝天啄（輕）', kind: 'special', untilLand: true, landRec: 14, startup: 3, active: 8, dmg: 100, stun: 150, blockstun: 20, launch: [2, -12], hitbox: [8, -110, 34, 84], hurtExt: [4, -100, 34, 60], vel: [[1, 2, 0, null], [3, 3, 2, -15]], cancel: ['super'] }),
    defineMove({ id: 'DP_H', name: '衝天啄（重）', kind: 'special', untilLand: true, landRec: 22, startup: 5, active: 8, dmg: 140, stun: 200, blockstun: 20, launch: [2, -12], hitbox: [8, -110, 34, 84], hurtExt: [4, -100, 34, 60], invuln: [[1, 6, 'full']], vel: [[1, 4, 0, null], [5, 5, 3, -15]], cancel: ['super'] }),
    defineMove({ id: 'DP_EX', name: '衝天啄（EX）', kind: 'special', ex: true, untilLand: true, landRec: 22, startup: 4, active: 10, hits: 2, dmg: [80, 80], stun: 120, blockstun: 20, launch: [2, -12], launchLast: true, hitbox: [8, -110, 34, 84], hurtExt: [4, -100, 34, 60], invuln: [[1, 6, 'full']], vel: [[1, 3, 0, null], [4, 4, 3, -15]], cancel: ['super'] }),
    ...variants([['L', 4, [40, 40, 40], null, '輕'], ['H', 6, [45, 45, 45], null, '重'], ['EX', 6, [50, 50, 60], [1, 7, 'full'], 'EX']], ([v, spd, dmg, inv, n]) => defineMove({
      id: 'TATSU_' + v, name: `旋風翅（${n}）`, kind: 'special', ex: v === 'EX', untilLand: true, landRec: 10, startup: 7, active: 24, hits: 3, dmg, stun: 60,
      hitstun: 18, blockstun: 14, pb: 4, launch: [3, -9], launchLast: true, hitbox: [-56, -58, 112, 40], hover: [5, 30],
      // 下半身沒有受擊判定、飛行道具穿過（越過下段與波）
      invuln: [[7, 30, 'lower'], [7, 30, 'proj'], ...(inv ? [inv] : [])],
      vel: [[1, 4, 0, -7], [5, 30, spd, 0], [31, 31, 0, null]], cancel: ['super'],
    })),
    defineMove({
      id: 'CA', name: '火雞連環踢', kind: 'super', startup: 4, active: 30, recovery: 24, hits: 6, dmg: [55, 55, 55, 55, 55, 75], hitstun: 24, blockstun: 12, pb: 2,
      launch: [4, -10], launchLast: true, hitbox: [10, -90, 56, 80], hurtExt: [10, -86, 46, 70], invuln: [[1, 10, 'full']],
      vel: (mt, cn) => [mt < 4 ? 0 : mt < 34 ? (cn ? 3 : 11) : 0, null],
    }),
  ];
  const M = {}; MOVE_LIST.forEach((m, i) => { M[m.id] = i; });
  const PROJ = [
    { speed: 5, n: 1, dmg: 60, stun: 100, hitstun: 20, blockstun: 16, hs: HS_HEAVY, pb: 8, kind: 'special', w: 32, h: 24 },
    { speed: 8, n: 1, dmg: 60, stun: 100, hitstun: 20, blockstun: 16, hs: HS_HEAVY, pb: 8, kind: 'special', w: 32, h: 24 },
    { speed: 7, n: 2, dmg: 50, stun: 80, hitstun: 20, blockstun: 16, hs: HS_HEAVY, pb: 8, kind: 'special', w: 40, h: 30 },
  ];

  // ---------- 狀態 ----------
  const P_FIELDS = ['x', 'y', 'vx', 'vy', 'f', 'st', 't', 'mv', 'mt', 'hm', 'cn', 'hs', 'bf', 'hp', 'wd', 'wdT', 'sg', 'sgT', 'dz', 'ex', 'vg', 'vt', 'cb', 'jg', 'kb', 'air', 'cr'];
  const Q_FIELDS = ['o', 'x', 'y', 'vx', 'n', 'lv', 'cd'];
  const S_FIELDS = ['tick', 'frz', 'fo', 'rs', 'rt', 'rnd', 'tm', 'win', 'to', 'lw'];
  function newPlayer(x, f) {
    const p = {}; for (const k of P_FIELDS) p[k] = 0;
    Object.assign(p, { x, f, mv: -1, hp: HP_MAX }); p.hist = new Array(HIST).fill(0);
    return p;
  }
  function createState() {
    return { tick: 0, frz: 0, fo: 0, rs: RS.INTRO, rt: INTRO_T, rnd: 1, tm: ROUND_TICKS, win: -1, to: 0, lw: -1, w: [0, 0],
      p: [newPlayer(STAGE_W / 2 - 120, 1), newPlayer(STAGE_W / 2 + 120, -1)], pr: [] };
  }
  const hexOf = (a) => a.map((v) => (v < 16 ? '0' : '') + v.toString(16)).join('');
  const histOf = (h) => { const a = new Array(HIST); for (let i = 0; i < HIST; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; };
  /** 快照：純數字陣列＋輸入歷史 hex 字串，整包 < 600 bytes */
  function packState(s) {
    return JSON.stringify([S_FIELDS.map((k) => s[k]), s.w, s.p.map((p) => [...P_FIELDS.map((k) => p[k]), hexOf(p.hist)]), s.pr.map((q) => Q_FIELDS.map((k) => q[k]))]);
  }
  function unpackState(str) {
    const [g, w, ps, qs] = JSON.parse(str), s = {};
    S_FIELDS.forEach((k, j) => { s[k] = g[j]; });
    s.w = w.slice();
    s.p = ps.map((a) => { const p = {}; P_FIELDS.forEach((k, j) => { p[k] = a[j]; }); p.hist = histOf(a[P_FIELDS.length]); return p; });
    s.pr = qs.map((a) => { const q = {}; Q_FIELDS.forEach((k, j) => { q[k] = a[j]; }); return q; });
    return s;
  }
  const cloneState = (s) => unpackState(packState(s));
  function hashStr(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h; }
  const hashState = (s) => hashStr(packState(s));

  // ---------- 輸入 ----------
  const maskAt = (p, t) => p.hist[((t % HIST) + HIST) % HIST];
  const pressAt = (p, t) => maskAt(p, t) & ~maskAt(p, t - 1) & BUTTONS;
  /** 數字鍵方向（相對面向）：6 = 前、4 = 後；左右同按、上下同按都算沒按 */
  function dirOf(mask, f) {
    const l = mask & LEFT, r = mask & RIGHT, u = mask & UP, d = mask & DOWN;
    const h = l && !r ? -1 : r && !l ? 1 : 0, v = u && !d ? 1 : d && !u ? -1 : 0;
    return 5 + h * f + v * 3;
  }
  /** 往回找：seq 依序出現在最近 win 個 tick 裡（中間可夾雜其他方向，鍵盤寬容） */
  function motion(p, t, f, seq, win) {
    let i = seq.length - 1;
    for (let k = 0; k < win && i >= 0; k++) if (dirOf(maskAt(p, t - k), f) === seq[i]) i--;
    return i < 0;
  }
  function recentPress(p, t) { let r = 0; for (let k = 0; k < MULTI_PRESS; k++) r |= pressAt(p, t - k); return r; }
  /** 雙鍵：兩顆都在最近 3 tick 內按下，而且其中一顆是這一 tick 按的 */
  const comboPressed = (p, t, bits) => (recentPress(p, t) & bits) === bits && (pressAt(p, t) & bits) !== 0;

  // ---------- 判定框 ----------
  const overlap = (a, b) => a[0] < b[0] + b[2] && b[0] < a[0] + a[2] && a[1] < b[1] + b[3] && b[1] < a[1] + a[3];
  const wbox = (p, b) => (p.f === 1 ? [p.x + b[0], p.y + b[1], b[2], b[3]] : [p.x - b[0] - b[2], p.y + b[1], b[2], b[3]]);
  function poseOf(p) {
    if (p.y < 0) return 'air';
    if (p.st === ST.CROUCH) return 'crouch';
    if (p.st === ST.MOVE) return MOVE_LIST[p.mv].posture === 'crouch' ? 'crouch' : 'stand';
    if (p.st === ST.HIT || p.st === ST.BLOCK) return p.cr ? 'crouch' : 'stand';
    return 'stand';
  }
  function pushbox(p) {
    const lying = (p.st === ST.KD || p.st === ST.KO) && p.y === 0;
    return wbox(p, PUSH[lying ? 'down' : poseOf(p)]);
  }
  function hurtboxes(p) {
    const st = p.st;
    if (st === ST.KD || st === ST.KO || st === ST.THROWN || st === ST.THROWING || st === ST.TECH) return [];
    if (st === ST.AIRHIT && p.jg >= JUGGLE_MAX) return [];
    let boxes = HURT[poseOf(p)];
    if (st === ST.MOVE) {
      const mv = MOVE_LIST[p.mv];
      if (mv.invulnAt(p.mt, 'full')) return [];
      if (mv.invulnAt(p.mt, 'lower')) boxes = boxes.slice(0, 1);
      if (mv.hurtExt && p.mt >= mv.S) boxes = [...boxes, mv.hurtExt];
    }
    return boxes.map((b) => wbox(p, b));
  }
  function hitboxOf(p) {
    if (p.st !== ST.MOVE) return null;
    const mv = MOVE_LIST[p.mv], k = mv.hitIndex(p.mt);
    if (k < 0) return null;
    return { box: wbox(p, mv.throwBox ?? mv.hitbox), used: (p.hm >> k) & 1, thr: !!mv.throwBox, k };
  }
  const projBox = (q) => { const d = PROJ[q.lv]; return [q.x - d.w / 2, q.y - d.h / 2, d.w, d.h]; };
  const projInvuln = (p) => p.st === ST.MOVE && MOVE_LIST[p.mv].invulnAt(p.mt, 'proj');
  function throwable(p) {
    if (p.y !== 0) return false;
    if (p.st === ST.MOVE) return !MOVE_LIST[p.mv].invulnAt(p.mt, 'throw');
    return p.st === ST.IDLE || p.st === ST.CROUCH || p.st === ST.LAND || p.st === ST.PREJUMP || p.st === ST.DIZZY;
  }
  /** 後(4) 站防擋中段/上段（overhead）；後下(1) 蹲防擋中段/下段 */
  function canBlock(s, B, fromX, guard) {
    if (B.y !== 0 || !(B.st === ST.IDLE || B.st === ST.CROUCH || B.st === ST.BLOCK)) return false;
    const toward = fromX === B.x ? B.f : fromX > B.x ? 1 : -1;
    const d = dirOf(maskAt(B, s.tick), toward);

    const label = p.st === SFV.ST.MOVE ? SFV.MOVE_LIST[p.mv].name : STATE_TEXT[SFV.ST_NAME[p.st]];
    if (label) text(ctx, label, p.x, y - 26, 13, '#fff');
    if (i === opt.me) text(ctx, '▼', p.x, y - 44, 12, COL.body[i], 'center', false);
    if (opt.showBoxes) {
      rect(ctx, b, null, COL.push);
      for (const hb of SFV.hurtboxes(p)) rect(ctx, hb, '#2ee66b33', COL.hurt);
      const hit = SFV.hitboxOf(p);
      if (hit) rect(ctx, hit.box, hit.used ? '#ff3b3b22' : '#ff3b3b88', COL.hit, hit.thr);
    }
  }
  function drawProjectiles(ctx, s, opt) {
    for (const q of s.pr) {
      const b = SFV.projBox(q);
      ctx.fillStyle = COL.proj[q.o]; ctx.beginPath(); ctx.roundRect(b[0], sy(b[1]), b[2], b[3], 12); ctx.fill();
      if (q.lv === 2) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
      if (opt.showBoxes) rect(ctx, b, null, COL.hit);
    }
  }
  function bar(ctx, x, y, w, h, frac, color, rightAnchored) {
    const fw = Math.max(0, Math.min(1, frac)) * w;
    ctx.fillStyle = color; ctx.fillRect(rightAnchored ? x + w - fw : x, y, fw, h);
  }
  function drawHud(ctx, s, opt) {
    const BW = 380, BX = [40, W - 40 - BW];
    for (let i = 0; i < 2; i++) {
      const p = s.p[i], x = BX[i], right = i === 1;
      ctx.fillStyle = '#000a'; ctx.fillRect(x - 3, 15, BW + 6, 30);
      ctx.fillStyle = '#3a1111'; ctx.fillRect(x, 18, BW, 20);
      bar(ctx, x, 18, BW, 20, (p.hp + p.wd) / SFV.HP_MAX, COL.white, right); // 白殘血（可回復）
      bar(ctx, x, 18, BW, 20, p.hp / SFV.HP_MAX, p.hp < 300 ? '#ff5c5c' : '#ffd84d', right);
      ctx.fillStyle = '#1a1030'; ctx.fillRect(x, 40, BW, 6);
      bar(ctx, x, 40, BW, 6, p.sg / SFV.STUN_MAX, p.dz || p.st === SFV.ST.DIZZY ? '#ff3bd4' : COL.stun, right);
      text(ctx, opt.names[i], right ? x + BW : x, 60, 14, COL.body[i], right ? 'right' : 'left');
      for (let k = 0; k < s.w[i]; k++) { ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(right ? x + 10 + k * 18 : x + BW - 10 - k * 18, 60, 6, 0, Math.PI * 2); ctx.fill(); }
      // 下方：3 格 EX、炸毛條
      for (let k = 0; k < 3; k++) {
        const ex = x + (right ? BW - (k + 1) * 64 : k * 64), fill = Math.max(0, Math.min(1, (p.ex - k * SFV.EX_BAR) / SFV.EX_BAR));
        ctx.fillStyle = '#0d1b2a'; ctx.fillRect(ex, H - 34, 60, 12);
        bar(ctx, ex, H - 34, 60, 12, fill, fill >= 1 ? COL.ex : '#2b5d85', right);
      }
      const vx = right ? x : x + BW - 170;
      ctx.fillStyle = '#2a0d14'; ctx.fillRect(vx, H - 34, 170, 12);
      if (p.vt > 0) { bar(ctx, vx, H - 34, 170, 12, p.vt / SFV.VT_TICKS, (s.tick >> 2) & 1 ? '#ff7a3b' : COL.vg, right); text(ctx, '炸毛中', vx + 85, H - 46, 12, '#ffb03b'); }
      else { bar(ctx, vx, H - 34, 170, 12, p.vg / SFV.VG_MAX, p.vg >= SFV.VG_MAX ? COL.vg : '#80303f', right); text(ctx, '炸毛', vx + 85, H - 46, 11, '#c88'); }
      text(ctx, `EX ${Math.floor(p.ex / SFV.EX_BAR)}`, right ? x + BW : x, H - 46, 11, COL.ex, right ? 'right' : 'left');
      const foe = s.p[1 - i];
      if (foe.cb >= 2) text(ctx, `${foe.cb} HITS`, right ? W - 70 : 70, 150, 28, '#ffe066');
    }
    ctx.fillStyle = '#000c'; ctx.fillRect(W / 2 - 34, 12, 68, 44);
    text(ctx, String(Math.ceil(s.tm / SFV.TICK_HZ)).padStart(2, '0'), W / 2, 35, 30, '#fff');
  }
  function drawBanner(ctx, s, opt) {
    const big = (str, color = '#ffe066') => text(ctx, str, W / 2, H / 2 - 30, 72, color);
    if (opt.ended?.aborted) { ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, W, H); big('比賽中止', '#ff5c5c'); text(ctx, '20:00 關門（aborted，不結算）', W / 2, H / 2 + 30, 20, '#fff'); return; }
    if (s.rs === SFV.RS.INTRO) big(s.rt > 45 ? `ROUND ${s.rnd}` : 'FIGHT!');
    else if (s.rs === SFV.RS.KO) big(s.to ? 'TIME' : s.lw === 2 ? 'DOUBLE K.O.' : 'K.O.', '#ff5c5c');
    else if (s.rs === SFV.RS.OVER) {
      ctx.fillStyle = '#0009'; ctx.fillRect(0, 0, W, H);
      big(s.win === 2 ? 'DRAW' : s.win === opt.me ? 'YOU WIN' : 'YOU LOSE', s.win === opt.me ? '#ffe066' : '#9aa');
      if (opt.settleText) text(ctx, opt.settleText, W / 2, H / 2 + 30, 18, '#fff');
      text(ctx, 'Enter 再來一場　Esc 回選角', W / 2, H / 2 + 62, 16, '#ccc');
    }
  }
  function drawFight(ctx, s, opt) {
    drawStage(ctx);
    const freezeOwner = s.frz > 0 ? s.fo - 1 : -1;
    drawProjectiles(ctx, s, opt);
    for (let i = 0; i < 2; i++) if (i !== freezeOwner) drawChick(ctx, s, i, opt);
    if (freezeOwner >= 0) { // 超必殺暗場特寫
      ctx.fillStyle = '#000000d8'; ctx.fillRect(0, 0, W, H);
      const p = s.p[freezeOwner];
      ctx.strokeStyle = (s.tick >> 1) & 1 ? '#ffe066' : '#ff3b3b'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(p.x, sy(-50), 40 + (30 - s.frz) * 6, 0, Math.PI * 2); ctx.stroke();
      drawChick(ctx, s, freezeOwner, opt);
      text(ctx, '火雞連環踢!!', W / 2, 200, 56, (s.tick >> 2) & 1 ? '#ffe066' : '#ff7a3b');
    }
    drawHud(ctx, s, opt);
    drawBanner(ctx, s, opt);
  }
  const SLOT_NAMES = ['鐵喙阿雞', '烤雞翅', '蛋殼騎士', '炸毛阿伯', '鹹酥雞', '溏心蛋', '滷蛋大俠', '三杯雞'];
  const ME = 'MY_CHICK_BABY';
  /** 選角：游標選哪一格都一樣，鎖定後全部變成自己的電子雞 */
  function drawSelect(ctx, sel, frame) {
    drawStage(ctx);
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    text(ctx, 'SELECT YOUR FIGHTER', W / 2, 70, 40, '#ffe066');
    const locked = sel.lockedAt >= 0, t = frame - sel.lockedAt;
    for (let k = 0; k < 8; k++) {
      const cx = 150 + (k % 4) * 220, cy = 190 + Math.floor(k / 4) * 170, on = k === sel.cursor;
      ctx.fillStyle = on ? '#3a3410' : '#1a1d29'; ctx.fillRect(cx - 95, cy - 65, 190, 130);
      ctx.strokeStyle = on ? ((frame >> 3) & 1 ? '#ffe066' : '#ff9f43') : '#33384a'; ctx.lineWidth = on ? 4 : 2; ctx.strokeRect(cx - 95, cy - 65, 190, 130);
      ctx.fillStyle = COL.body[k % 2]; ctx.beginPath(); ctx.roundRect(cx - 22, cy - 40, 44, 56, 10); ctx.fill();
      ctx.fillStyle = '#ff8c1a'; ctx.beginPath(); ctx.moveTo(cx + 18, cy - 26); ctx.lineTo(cx + 32, cy - 20); ctx.lineTo(cx + 18, cy - 14); ctx.fill();
      text(ctx, locked && t > 20 ? ME : SLOT_NAMES[k], cx, cy + 40, locked && t > 20 ? 15 : 17, '#fff');
    }
    if (locked) text(ctx, `${ME}`, W / 2, H - 60, t > 20 ? 44 : 30, (frame >> 2) & 1 ? '#ffe066' : '#ff7a3b');
    else text(ctx, 'W A S D 移動　U 確定', W / 2, H - 60, 20, '#ccc');
  }
  const ARROW = { 1: '↙', 2: '↓', 3: '↘', 4: '←', 5: '・', 6: '→', 7: '↖', 8: '↑', 9: '↗' };
  /** 輸入紀錄：連續相同的 tick 合成一列（最新在上），方向用螢幕方向（不分面向） */
  function inputRuns(hist, i) {
    const runs = [];
    for (const pair of hist) {
      const m = pair[i], last = runs[runs.length - 1];
      if (last && last.m === m) last.n++; else runs.push({ m, n: 1 });
    }
    return runs.reverse().map(({ m, n }) => {
      const btn = [[SFV.LP, 'LP'], [SFV.HP, 'HP'], [SFV.LK, 'LK'], [SFV.HK, 'HK']].filter(([b]) => m & b).map(([, l]) => l).join('+');
      return { dir: ARROW[SFV.dirOf(m, 1)], btn, n };
    });
  }
  return { SimLink, NetClient, createWorld, createBot, drawFight, drawSelect, inputRuns, INPUT_DELAY, BATCH_TICKS, CLIENT_MAX_PER_SEC };
})(SFV, SFVServer);
// === [END MODULE 3] ===

// === [BOOT: 頁面接線（鍵盤、監控面板、按鈕）] ===
(() => {
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const { UP, DOWN, LEFT, RIGHT, LP, HP, LK, HK } = SFV;
  // 用 e.code（實體按鍵），開著中文輸入法也能玩
  const KEY_BITS = { KeyW: UP, KeyS: DOWN, KeyA: LEFT, KeyD: RIGHT, KeyU: LP, KeyI: HP, KeyJ: LK, KeyK: HK, KeyH: LP | LK, KeyL: HP | HK };
  const held = new Set();
  const keyMask = () => { let m = 0; for (const c of held) m |= KEY_BITS[c] ?? 0; return m; };
  const net = { rtt: 100, jitter: 10 };
  const bot = SFVClient.createBot();
  const ui = { screen: 'select', sel: { cursor: 0, lockedAt: -1 }, frame: 0, world: null, opp: 'ai', showBoxes: true, matchNo: 0, log: '' };
  const samplers = [() => keyMask(), (s, pid) => bot(ui.opp)(s, pid)];

  function startMatch() {
    ui.matchNo++;
    ui.world = SFVClient.createWorld({ matchId: `proto-${Date.now()}-${ui.matchNo}`, now: performance.now(), net, samplers, users: ['你', 'CPU'] });
    ui.screen = 'fight'; ui.log = '';
  }
  function toSelect() { ui.world = null; ui.screen = 'select'; ui.sel.lockedAt = -1; }

  addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
    if (KEY_BITS[e.code] !== undefined || e.code === 'Enter' || e.code === 'Escape') e.preventDefault();
    if (ui.screen === 'select') {
      if (e.repeat || ui.sel.lockedAt >= 0) return;
      const c = ui.sel.cursor;
      if (e.code === 'KeyA') ui.sel.cursor = (c + 7) % 8;
      else if (e.code === 'KeyD') ui.sel.cursor = (c + 1) % 8;
      else if (e.code === 'KeyW' || e.code === 'KeyS') ui.sel.cursor = (c + 4) % 8;
      else if (e.code === 'KeyU' || e.code === 'Enter') ui.sel.lockedAt = ui.frame;
      return;
    }
    if (KEY_BITS[e.code] !== undefined) held.add(e.code);
    const over = ui.world && ui.world.room.status !== 'playing';
    if (over && e.code === 'Enter') startMatch();
    if (e.code === 'Escape') toSelect();
  });
  addEventListener('keyup', (e) => held.delete(e.code));
  addEventListener('blur', () => held.clear());

  $('rtt').addEventListener('input', (e) => { net.rtt = +e.target.value; $('rttOut').textContent = `${net.rtt}ms`; });
  $('jit').addEventListener('input', (e) => { net.jitter = +e.target.value; $('jitOut').textContent = `${net.jitter}ms`; });
  $('opp').addEventListener('change', (e) => { ui.opp = e.target.value; e.target.blur(); });
  $('boxes').addEventListener('change', (e) => { ui.showBoxes = e.target.checked; e.target.blur(); });
  $('close').addEventListener('click', (e) => { e.target.blur(); if (ui.world) ui.world.room.closesAt = performance.now(); });
  $('resettle').addEventListener('click', (e) => {
    e.target.blur();
    const r = ui.world?.room;
    if (!r || r.status !== 'done') { ui.log = '還沒有結算過的比賽（打完一場再試）'; return; }
    const again = SFVServer.settleMatch(r.matchId, r.outcome);
    ui.log = `重送結算 ${r.matchId}：applied=${again.applied}（${again.applied ? '轉帳了！' : '已結算過，忽略，不會重複轉帳'}）`;
  });
  $('toSelect').addEventListener('click', (e) => { e.target.blur(); toSelect(); });

  // 伺服器、網路、兩個客戶端每 4ms 推進一次（不綁畫面更新率）；畫面用 rAF
  setInterval(() => { if (ui.world) ui.world.pump(performance.now()); }, 4);
  function settleText(r) {
    if (!r?.result) return '';
    const t = r.result.transfers[0];
    return t ? `結算：${t.from} → ${t.to} ◎${t.coins}（冪等，只轉一次）` : '結算：平手不轉帳';
  }
  function render() {
    ui.frame++;
    if (ui.screen === 'select') {
      SFVClient.drawSelect(ctx, ui.sel, ui.frame);
      if (ui.sel.lockedAt >= 0 && ui.frame - ui.sel.lockedAt > 72) startMatch();
    } else if (ui.world) {
      const c = ui.world.clients[0];
      SFVClient.drawFight(ctx, c.predicted, { showBoxes: ui.showBoxes, me: 0, names: ['MY_CHICK_BABY（你）', `MY_CHICK_BABY（${ui.opp === 'ai' ? 'CPU' : '木樁'}）`], ended: c.ended, settleText: settleText(ui.world.room) });
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // ---------- 即時監控面板 ----------
  const card = (label, value, cls, sub) => `<div class="card"><span>${label}</span><b class="${cls}">${value}</b><span>${sub}</span></div>`;
  function historyHtml(hist, i) {
    return SFVClient.inputRuns(hist, i).slice(0, 26).map((r) => `<li><span>${r.dir} ${r.btn}</span><i>${r.n}</i></li>`).join('');
  }
  setInterval(() => {
    $('log').textContent = ui.log;
    const w = ui.world;
    if (!w) { $('mon').innerHTML = card('狀態', '選角中', '', '—'); $('histL').innerHTML = $('histR').innerHTML = ''; return; }
    const now = performance.now(), c = w.clients[0], st = w.room.stats;
    const perSec = c.perSec(now), maxDown = Math.max(...w.down.map((l) => l.maxBytes));
    $('mon').innerHTML = [
      card('Messages/sec ↑', perSec, perSec <= 35 ? 'ok' : 'bad', `上限 35・最高 ${c.stats.maxPerSec}`),
      card('伺服器丟棄', st.dropped[0], st.dropped[0] ? 'bad' : 'ok', `本地暫緩 ${c.stats.held}`),
      card('Snapshot bytes', st.snapBytes, st.maxSnapBytes < 600 ? 'ok' : 'bad', `狀態 <600・訊息 ${st.snapMsgBytes}`),
      card('最大訊息 bytes', maxDown, maxDown < 8000 ? 'ok' : 'bad', `NOTIFY 上限 8000・超標 ${st.oversize}`),
      card('Simulated RTT', c.rtt == null ? '—' : `${Math.round(c.rtt)}ms`, '', `設定 ${net.rtt}±${net.jitter}`),
      card('Rollback Count', c.stats.rollbacks, '', `上次重算 ${c.stats.lastResim} tick`),
      card('預測領先', `${c.L - c.C} tick`, '', `提前量 ${c.lead()}（+${c.extraLead}）`),
      card('遲到輸入', st.late[0], st.late[0] ? 'warn' : 'ok', '伺服器順延到下一 tick'),
      card('Desync', c.stats.desync, c.stats.desync ? 'bad' : 'ok', `快照核對 OK ${c.stats.snapsOk}`),
      card('Tick', `${w.room.tick}`, '', `本地 ${c.L}・確認 ${c.C}・${w.room.status}`),
    ].join('');
    $('histL').innerHTML = historyHtml(c.histConf, 0);
    $('histR').innerHTML = historyHtml(c.histConf, 1);
  }, 200);
})();
</script>
</body>
