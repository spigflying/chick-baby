name: 部署結束頁

# 2026-11-10 起服務停止營運：chick.thesilvertrees.com 只剩一個靜態結束頁（apps/the-end/）。
# 遊戲本體（apps/web、apps/server）不再建置與部署；資料庫已匯出到 gs://silver-greens-chick-archive 並刪除。
# push main 或手動執行都會直接部署結束頁。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
  workflow_dispatch:

env:
  PROJECT_ID: silver-greens
  REGION: asia-east1
  SERVICE: chick-baby
  IMAGE: asia-east1-docker.pkg.dev/silver-greens/chick/the-end
  # Workload Identity Federation：只有 spigflying/chick-baby（repo id 1416379139）的 main 分支換得到權限，不用 JSON key。
  # chick-deployer 只有：推 chick 映像、部署 chick-baby 服務、以 chick-run 身分執行。設定見 docs/DEPLOY.md §10。
  WIF_PROVIDER: projects/704427759894/locations/global/workloadIdentityPools/github/providers/chick-baby
  DEPLOY_SA: chick-deployer@silver-greens.iam.gserviceaccount.com

permissions:
  contents: read

concurrency:
  group: chick-baby-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: 建置並部署結束頁
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: 建置映像
        run: |
          TAG=${GITHUB_SHA::7}
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:$TAG" apps/the-end

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: 推映像並部署 Cloud Run
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          docker push "$IMAGE:$TAG"
          # 只換映像，其餘設定沿用目前的服務（已清掉 Cloud SQL／環境變數／secret，CPU 只在處理請求時計費）
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE:$TAG" --quiet

      - name: 驗證線上版本
        run: |
          img=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')
          echo "serving image: $img"
          [ "$img" = "$IMAGE:$TAG" ]
          for i in 1 2 3 4 5 6; do
            curl -fsS https://chick.thesilvertrees.com/ | grep -q '<title>THE END</title>' && ok=1 && break; sleep 10
          done
          [ "${ok:-}" = 1 ]
          echo "- 線上映像：\`$img\`" >> "$GITHUB_STEP_SUMMARY"
