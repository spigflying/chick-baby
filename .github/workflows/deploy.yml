name: 測試與部署

# push main：一律建置（Dockerfile 內會跑 typecheck 與測試）；非開放時間才自動部署。
# 開放時間（平日 09:00–20:00 台北）換版會中止進行中的對戰／下樓梯，所以只測試不部署；
# 要在開放時間上線就到 Actions 手動執行（workflow_dispatch），一定會部署。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
  workflow_dispatch:

env:
  PROJECT_ID: silver-greens
  REGION: asia-east1
  SERVICE: chick-baby
  IMAGE: asia-east1-docker.pkg.dev/silver-greens/chick/server
  # Workload Identity Federation：只有 spigflying/chick-baby（repo id 1416379139）的 main 分支換得到權限，不用 JSON key。
  # chick-deployer 只有：推 chick 映像、部署 chick-baby 服務、以 chick-run 身分執行。設定見 docs/DEPLOY.md §10。
  WIF_PROVIDER: projects/704427759894/locations/global/workloadIdentityPools/github/providers/chick-baby
  DEPLOY_SA: chick-deployer@silver-greens.iam.gserviceaccount.com

permissions:
  contents: read

concurrency:
  group: chick-baby-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: 建置、測試、部署
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: 決定要不要部署
        id: gate
        run: |
          dow=$(TZ=Asia/Taipei date +%u); hm=$((10#$(TZ=Asia/Taipei date +%H%M)))
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then deploy=true; why="手動執行"
          elif [ "$dow" -le 5 ] && [ "$hm" -ge 900 ] && [ "$hm" -lt 2000 ]; then deploy=false; why="開放時間（平日 09:00–20:00），只測試不部署；要上線請手動執行此 workflow"
          else deploy=true; why="非開放時間"
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "### 部署：$deploy（$why）" >> "$GITHUB_STEP_SUMMARY"
          echo "deploy=$deploy ($why)"

      - name: 建置映像（含 typecheck 與測試）
        run: |
          TAG=${GITHUB_SHA::7}
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:$TAG" .

      - uses: google-github-actions/auth@v3
        if: steps.gate.outputs.deploy == 'true'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        if: steps.gate.outputs.deploy == 'true'

      - name: 推映像並部署 Cloud Run
        if: steps.gate.outputs.deploy == 'true'
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
          docker push "$IMAGE:$TAG"
          # 只換映像，其餘設定（環境變數、secret、Cloud SQL、資源）沿用目前的服務
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE:$TAG" --quiet

      - name: 驗證線上版本
        if: steps.gate.outputs.deploy == 'true'
        run: |
          img=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')
          echo "serving image: $img"
          [ "$img" = "$IMAGE:$TAG" ]
          for i in 1 2 3 4 5 6; do
            s=$(curl -fsS https://chick.thesilvertrees.com/api/status) && break; sleep 10
          done
          echo "status: $s"
          echo "- 線上映像：\`$img\`" >> "$GITHUB_STEP_SUMMARY"
