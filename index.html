<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>小雞寶寶 電子雞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@chinese-fonts/cubic@3.0.0/dist/Cubic/result.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="device" id="device">
  <canvas id="shell" class="shell"></canvas>
  <div class="inner">
    <div class="brand">CHICK♥BABY</div>
    <div class="lcd">
      <div class="lcd-top"><span id="petName">—</span><span id="stage">蛋</span><span id="age">0分</span></div>
      <canvas id="screen" width="96" height="80"></canvas>
      <p class="msg" id="msg">歡迎！</p>
    </div>
    <section class="actions">
      <button data-act="feed">餵食</button>
      <button data-act="play">玩耍</button>
      <button data-act="sleep" id="sleepBtn">睡覺</button>
      <button data-act="clean">清潔</button>
      <button data-act="doctor">看醫生</button>
    </section>
    <button class="restart" id="restart">重新開始</button>
  </div>
</main>
<dialog id="nameDialog">
  <form method="dialog" id="nameForm">
    <p>幫你的小雞取個名字吧！</p>
    <input id="nameInput" maxlength="12" placeholder="例如：小黃" required>
    <button>開始孵蛋</button>
  </form>
</dialog>
<script src="script.js"></script>
</body>
</html>
