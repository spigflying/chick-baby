<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>小雞寶寶 電子雞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@chinese-fonts/cubic@3.0.0/dist/Cubic/result.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="device" id="device">
  <canvas id="shell" class="shell"></canvas>
  <div class="inner">
    <div class="brand">CHICK♥BABY</div>
    <div class="lcd">
      <div class="lcd-top"><span id="petName">—</span><span id="stage">蛋</span><span id="age">0分</span></div>
      <div class="scr"><canvas id="screen" width="96" height="96"></canvas><div class="menu" id="menu" hidden></div></div>
      <div class="labels" id="labels"><span data-i="0">餵食</span><span data-i="1">玩耍</span><span data-i="2">睡覺</span><span data-i="3">清潔</span><span data-i="4">醫生</span><span data-i="5">狀態</span></div>
      <p class="msg" id="msg">歡迎！</p>
    </div>
  </div>
</main>
<dialog id="nameDialog">
  <form method="dialog" id="nameForm">
    <p>幫你的小雞取個名字吧！</p>
    <input id="nameInput" maxlength="12" placeholder="例如：小黃" required>
    <button>開始孵蛋</button>
  </form>
</dialog>
<script src="script.js"></script>
</body>
</html>
